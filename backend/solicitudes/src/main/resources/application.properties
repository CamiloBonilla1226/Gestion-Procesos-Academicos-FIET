spring.application.name=solicitudes-consejo-de-facultad

#URL
url.application=/api/unicauca/fiet/consejo/
url.backend=http://localhost:8080
url.frontend=http://localhost:4200

jwt.secreto=${JWT_SECRET:}

# Server port
server.port=${SERVER_PORT}

# DATASOURCE (MYSQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT_MS:30000}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# IMPORT SQL
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true
# Ruta base para archivos cargados
app.uploads.base-path=${UPLOADS_PATH:/app/uploads}

# Table names physically
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Tamanio de archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.localhost=${MAIL_EHLO:fiet-unicauca.local}
correo.darca.destinatario=${CORREO_DARCA:}
correo.firma.nombre=CRISTIAN ESTIBEN ILLERA OSPITIA
correo.firma.cargo=Apoyo Administrativo
correo.firma.dependencia=Decanatura
correo.firma.facultad=Facultad de Ingenier\u00eda Electr\u00f3nica y Telecomunicaciones
correo.resolucion.prefijo=8.4.2-4.10/
resolucion.firmante=ALEJANDRO TOLEDO TOVAR
resolucion.reviso=Carolina Chilito
correo.resolucion.intervalo-ms=${CORREO_RESOLUCION_INTERVALO_MS:60000}
correo.resolucion.retraso-inicial-ms=${CORREO_RESOLUCION_RETRASO_INICIAL_MS:15000}
correo.pendientes.intervalo-ms=${CORREO_PENDIENTES_INTERVALO_MS:60000}
correo.pendientes.retraso-inicial-ms=${CORREO_PENDIENTES_RETRASO_INICIAL_MS:20000}
