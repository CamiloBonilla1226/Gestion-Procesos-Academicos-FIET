<div class="tabla-scroll">
<table class="table table-bordered">
  <thead *ngIf="encabezadoAgrupado?.length" class="encabezado-agrupado">
    <tr *ngFor="let fila of encabezadoAgrupado; let primera = first">
      <th *ngFor="let celda of fila" [attr.colspan]="celda.colspan > 1 ? celda.colspan : null"
        [attr.rowspan]="celda.rowspan > 1 ? celda.rowspan : null" [class.grupo]="celda.colspan > 1">{{ celda.titulo }}</th>
      <th *ngIf="primera && actionTemplate" [attr.rowspan]="encabezadoAgrupado!.length > 1 ? encabezadoAgrupado!.length : null">Acciones</th>
    </tr>
  </thead>
  <thead *ngIf="!encabezadoAgrupado?.length">
    <tr>
      <th *ngFor="let header of headers">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span>{{ header.title }}</span>
          <ng-container *ngIf="header.headerTemplate" [ngTemplateOutlet]="header.headerTemplate">
          </ng-container>
        </div>
      </th>
      <th *ngIf="actionTemplate">Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
      <td *ngFor="let header of headers">
        <ng-container *ngIf="header.cellTemplate; else valorPlano" [ngTemplateOutlet]="header.cellTemplate"
          [ngTemplateOutletContext]="{ $implicit: row, valor: row[header.title] }">
        </ng-container>
        <ng-template #valorPlano>{{ row[header.title] }}</ng-template>
      </td>
      <td *ngIf="actionTemplate">
        <ng-container *ngTemplateOutlet="actionTemplate; context: { $implicit: row }"></ng-container>
      </td>
    </tr>
  </tbody>
</table>
</div>
