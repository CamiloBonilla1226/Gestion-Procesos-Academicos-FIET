<p-dialog [(visible)]="visible" [modal]="true" [closable]="false" styleClass="custom-dialog" (keydown.escape)="alPulsarEscape()">

  <ng-template pTemplate="header">
    <div class="custom-dialog-header">
      <span class="custom-dialog-titulo">{{ title }}</span>
      <button type="button" class="close-btn" aria-label="Cerrar" (click)="close()">&times;</button>
    </div>
  </ng-template>

  <div class="dialog-content" *ngIf="visible">
    <ng-content></ng-content>
  </div>
  <ng-template pTemplate="footer">
    <div class="custom-dialog-pie">
      <app-simple-button-component *ngIf="textoCancelar" data-boton-cancelar [label]="textoCancelar" width="auto" height="36px"
        color="#2A3A86" [contorno]="true" (clicked)="close()">
      </app-simple-button-component>
      <app-simple-button-component data-boton-dialogo [label]="textoBoton" [width]="anchoBoton" height="36px" color="#2A3A86" (clicked)="onSave()">
      </app-simple-button-component>
    </div>
  </ng-template>
</p-dialog>
